name: open-purchase-cockpit
services:
  frontend:
    image: node:20-bookworm-slim
    working_dir: /workspace
    command: ["npm", "run", "serve", "--", "--accept-remote-connections"]
    ports: ["8080:8080"]
    volumes:
      - .:/workspace
      - frontend_node_modules:/workspace/node_modules
    environment:
      NODE_ENV: development
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/index.html').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:16-alpine
    profiles: ["backend"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opc}
      POSTGRES_USER: ${POSTGRES_USER:-opc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
volumes:
  frontend_node_modules:
  postgres_data:
  redis_data:
